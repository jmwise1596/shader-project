<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Shader Engine</title>
    <link rel="stylesheet" href="GlobalStyles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <canvas id="canvas"></canvas>
    
    <script type="module">
        // Import your shader engine
        import { initFluidSimulation } from './fluidShaderEngine.js';
        
        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            initFluidSimulation(canvas);
        });
    </script>
</body>
</html>
