<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Shader Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f5f4f0;
            font-family: 'JetBrains Mono', monospace;
        }

        body.dark {
            background: #1a1a1a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            alert('WebGL 2 not supported');
            throw new Error('WebGL 2 not supported');
        }

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Shaders
        const vsSource = `#version 300 es
        in vec2 pos;
        out vec2 uv;
        void main() {
            uv = pos * 0.5 + 0.5;
            gl_Position = vec4(pos, 0.0, 1.0);
        }`;

        const fsSource = `#version 300 es
        precision highp float;
        in vec2 uv;
        out vec4 outColor;
        uniform sampler2D tex;
        
        void main() {
            vec3 col = texture(tex, uv).rgb;
            outColor = vec4(col, 1.0);
        }`;

        // Compile shader
        function compileShader(src, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, src);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        // Create program
        const vs = compileShader(vsSource, gl.VERTEX_SHADER);
        const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        // Create VAO
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const posLoc = gl.getAttribLocation(program, 'pos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        // Create texture
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        // Framebuffer
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

        // Initialize
        gl.clearColor(0.05, 0.05, 0.06, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Paint function
        function paint(x, y) {
            x = x / canvas.width;
            y = 1.0 - (y / canvas.height);
            
            const size = 20;
            const data = new Uint8Array(size * size * 4);
            for (let i = 0; i < size * size; i++) {
                const dx = (i % size) - size / 2;
                const dy = Math.floor(i / size) - size / 2;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const strength = Math.exp(-dist * dist / 20);
                
                data[i * 4 + 0] = Math.random() * 255 * strength;
                data[i * 4 + 1] = Math.random() * 255 * strength;
                data[i * 4 + 2] = Math.random() * 255 * strength;
                data[i * 4 + 3] = 255;
            }
            
            gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
            gl.texSubImage2D(gl.TEXTURE_2D, 0, 
                Math.floor(x * canvas.width - size / 2),
                Math.floor(y * canvas.height - size / 2),
                size, size, gl.RGBA, gl.UNSIGNED_BYTE, data);
        }

        // Input handling
        let isDrawing = false;
        canvas.addEventListener('mousedown', () => { isDrawing = true; });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) paint(e.clientX, e.clientY);
        });
        canvas.addEventListener('touchstart', () => { isDrawing = true; });
        canvas.addEventListener('touchend', () => { isDrawing = false; });
        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing) paint(e.touches[0].clientX, e.touches[0].clientY);
        });

        // Render loop
        function render() {
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.clearColor(0.05, 0.05, 0.06, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            gl.useProgram(program);
            gl.bindVertexArray(vao);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.uniform1i(gl.getUniformLocation(program, 'tex'), 0);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
